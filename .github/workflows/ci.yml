name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Linters
        run: pip install flake8

      - name: Lint Python (Flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Lint Shell Scripts (ShellCheck)
        run: shellcheck setup.sh || true 

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: mywebapp
          POSTGRES_PASSWORD: password
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest with Coverage
        env:
          DB_HOST: 127.0.0.1
          DB_USER: mywebapp
          DB_PASSWORD: password
          DB_NAME: inventory
        run: |
          python migrate.py
          pytest --cov=app test_app.py --cov-report=term-missing --cov-report=html --cov-fail-under=40

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: coverage-report
          path: htmlcov/

  build-and-push:
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-and-verify:
    needs: [build-and-push]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: self-hosted
    env:
      TARGET_HOST: 10.191.51.182
      TARGET_USER: dmytro
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare setup script with real repository name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          sed -i "s|\${GITHUB_REPOSITORY_PLACEHOLDER}|$REPO_LOWER|g" setup-target.sh

      - name: Copy setup script to Target Node
        run: |
          scp -o StrictHostKeyChecking=no setup-target.sh ${{ env.TARGET_USER }}@${{ env.TARGET_HOST }}:~/setup-target.sh
          ssh -o StrictHostKeyChecking=no ${{ env.TARGET_USER }}@${{ env.TARGET_HOST }} "chmod +x ~/setup-target.sh && ./setup-target.sh"

      - name: Pull image and Run Migrations on Target Node
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          ssh -o StrictHostKeyChecking=no ${{ env.TARGET_USER }}@${{ env.TARGET_HOST }} "
            sudo docker pull ghcr.io/$REPO_LOWER:stable
            sudo docker run --rm --net=host -v /etc/mywebapp/config.json:/etc/mywebapp/config.json:ro ghcr.io/$REPO_LOWER:stable python migrate.py
          "

      - name: Restart Application Service on Target Node
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.TARGET_USER }}@${{ env.TARGET_HOST }} "sudo systemctl restart mywebapp-container.service"

      - name: Verify Deployment (Service Discovery & Nginx)
        run: |
          sleep 5
          echo "Checking HTTP status code from Nginx..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ env.TARGET_HOST }}/)
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Verification failed! Nginx returned status $STATUS_CODE"
            exit 1
          fi
          echo "Nginx proxy configuration is valid. Status 200 OK received."

          echo "Checking application endpoint responsiveness..."
          ALIVE_STATUS=$(curl -s http://${{ env.TARGET_HOST }}/items)
          if [[ -z "$ALIVE_STATUS" ]]; then
            echo "Verification failed! App items endpoint is down."
            exit 1
          fi
          echo "Verification successful! Service is healthy."