name: CI Pipeline

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Linters
        run: pip install flake8

      - name: Lint Python (Flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Lint Shell Scripts (ShellCheck)
        run: shellcheck setup.sh || true 

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: mywebapp
          POSTGRES_PASSWORD: password
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest with Coverage
        env:
          DB_HOST: 127.0.0.1
          DB_USER: mywebapp
          DB_PASSWORD: password
          DB_NAME: inventory
        run: |
          # Запускаємо тести і вимагаємо мінімум 40% покриття
          pytest --cov=app test_app.py --cov-report=term-missing --cov-report=html --cov-fail-under=40

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: coverage-report
          path: htmlcov/